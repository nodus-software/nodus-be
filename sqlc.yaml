version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/audit/postgres/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/audit/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true

  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/auth/postgres/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/auth/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
