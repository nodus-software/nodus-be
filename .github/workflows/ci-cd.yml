name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/nodus-software/nodus-be

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nodus_ci
          POSTGRES_USER: nodus
          POSTGRES_PASSWORD: nodus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodus -d nodus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        env:
          CGO_ENABLED: "1"
          TEST_DATABASE_URL: postgres://nodus:nodus@127.0.0.1:5432/nodus_ci?sslmode=disable
        run: go test -race ./...

      - name: Build commands
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/api ./cmd/migrate

      - name: Validate observability deployment
        shell: bash
        run: |
          docker run --rm \
            -e LOKI_URL=https://logs.example.com/loki/api/v1/push \
            -e LOKI_USERNAME=ci \
            -e GRAFANA_CLOUD_API_KEY=ci \
            -e LOKI_ENVIRONMENT=ci \
            -e LOKI_INSTANCE=github-actions \
            -v "${PWD}/deploy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.18.0 validate --stability.level=experimental /etc/alloy/config.alloy
          install -m 600 /dev/null deploy/.env
          install -m 600 /dev/null deploy/alloy.env
          IMAGE_REF=ghcr.io/nodus-software/nodus-be@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            MIGRATION_DB_URL=postgres://ci:ci@db:5432/ci \
            docker compose -f deploy/compose.production.yml config --quiet
          rm deploy/.env deploy/alloy.env

      - name: Apply migrations to a clean database
        env:
          MIGRATION_DB_URL: postgres://nodus:nodus@127.0.0.1:5432/nodus_ci?sslmode=disable
        run: go run ./cmd/migrate

      - name: Verify migrations are idempotent
        env:
          MIGRATION_DB_URL: postgres://nodus:nodus@127.0.0.1:5432/nodus_ci?sslmode=disable
          PGPASSWORD: nodus
        shell: bash
        run: |
          go run ./cmd/migrate
          expected_version="$(find migrations -maxdepth 1 -name '*.up.sql' -printf '%f\n' | sort --version-sort | tail -n 1 | cut -d_ -f1 | sed 's/^0*//')"
          migration_state="$(psql --host 127.0.0.1 --username nodus --dbname nodus_ci --tuples-only --no-align --field-separator=: --command 'SELECT version, dirty FROM schema_migrations')"
          test "${migration_state}" = "${expected_version}:f"

  package:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nodus-software/nodus-be
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: true
          sbom: true

      - name: Record published image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: printf '## Published image\n\n`%s`\n' "${IMAGE_REF}" >> "${GITHUB_STEP_SUMMARY}"
