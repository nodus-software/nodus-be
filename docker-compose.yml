services:
  db:
    image: postgres:16-alpine
    container_name: nodus_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-nodus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nodus}
      POSTGRES_DB: ${DB_NAME:-nodus_health}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nodus_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nodus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nodus_postgres_data:
