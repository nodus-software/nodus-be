      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveEncounterForm' } } } }
      responses: { '200': { description: Saved draft }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /clinical/encounters/{encounterId}/form/submit:
    post:
      tags: [Clinical]
      security: [{ bearerAuth: [] }]
      summary: Validate and submit an encounter form, projecting bound observations
      parameters: [{ name: encounterId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [revision], properties: { revision: { type: integer, minimum: 0 } } } } } }
      responses: { '200': { description: Submitted form }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /clinical/encounters/{encounterId}/complete:
    post:
      tags: [Clinical]
      security: [{ bearerAuth: [] }]
      summary: Complete a submitted encounter; triage completion atomically routes to consultation
      description: >
        Triage encounters require outpatient:triage. Completion atomically completes the
        active triage queue entry and creates a waiting consultation entry using the
        organization's configured encounter.completed routing rule; clients do not supply
        a destination queue. Consultation encounters require outpatient:consult.
      parameters: [{ name: encounterId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteEncounter' } } } }
      responses: { '200': { description: Completed encounter }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
