      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Download the catalogue CSV template
      parameters: [{ name: catalogue, in: path, required: true, schema: { type: string, enum: [services, medications] } }]
      responses: { "200": { description: CSV template, content: { text/csv: { schema: { type: string, format: binary } } } } }
  /clinical/config/{catalogue}/imports/preview:
    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Validate and stage a catalogue CSV import
      parameters: [{ name: catalogue, in: path, required: true, schema: { type: string, enum: [services, medications] } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mode]
              properties:
                file: { type: string, format: binary }
                mode: { type: string, enum: [create_only, upsert], default: create_only }
      responses: { "200": { description: Import preview, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogueImportPreviewResponse" } } } } }
  /clinical/config/{catalogue}/imports/{importId}/commit:
    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Atomically commit a valid staged catalogue import
      parameters:
        - { name: catalogue, in: path, required: true, schema: { type: string, enum: [services, medications] } }
        - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "200": { description: Import committed }, "409": { $ref: "#/components/responses/Conflict" } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: nodus_refresh
      description: >
        Rotating opaque refresh token. Issued HttpOnly, Secure in production, and
        SameSite=Lax by default (Strict is also supported). Cross-site cookie mode is
        intentionally unsupported without a separate CSRF-token design. JavaScript must
        never read or persist its value.

  parameters:
    TenantSlugHeader:
      name: X-Tenant-Slug
      in: header
      required: false
      description: Local-development substitute for the tenant subdomain. Do not send in production.
      schema: { type: string, pattern: "^[a-z0-9-]{3,32}$" }

  responses:
    BadRequest:
      description: Invalid request body, tenant, token, or request parameter
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication failed or the session/token is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated caller lacks the required permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The requested tenant or tenant-scoped resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The requested state conflicts with an existing resource or invariant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Request field validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Gone:
      description: The supplied one-time token has expired or was consumed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    TemplateOption:
      type: object
      required: [value, label]
      properties: { value: { type: string }, label: { type: string } }
    TemplateField:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string }
        type: { type: string, enum: [short_text, long_text, number, boolean, single_select, multi_select, date] }
        help_text: { type: string, nullable: true }
        required: { type: boolean }
        options: { type: array, items: { $ref: '#/components/schemas/TemplateOption' } }
        validation:
          type: object
          properties: { min: { type: number }, max: { type: number }, min_length: { type: integer, minimum: 0 }, max_length: { type: integer, minimum: 0 } }
        binding:
          type: object
          required: [kind, code]
          properties: { kind: { type: string, enum: [observation] }, code: { type: string }, unit: { type: string, nullable: true } }
    TemplateDefinition:
      type: object
      required: [schema_version, sections]
      properties:
        schema_version: { type: integer, enum: [1] }
        sections:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [key, title, fields]
            properties:
              key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
              title: { type: string }
              description: { type: string, nullable: true }
              fields: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TemplateField' } }
    CreateClinicalTemplate:
      type: object
      required: [code, name, encounter_type, definition]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        encounter_type: { type: string, enum: [triage, consultation] }
        definition: { $ref: '#/components/schemas/TemplateDefinition' }
    UpdateClinicalTemplateDraft:
      type: object
      required: [definition]
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        definition: { $ref: '#/components/schemas/TemplateDefinition' }
    ClinicalTemplateVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published, superseded] }
        definition: { $ref: '#/components/schemas/TemplateDefinition' }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time, nullable: true }
    ClinicalTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        encounter_type: { type: string, enum: [triage, consultation] }
        is_default: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        published: { $ref: '#/components/schemas/ClinicalTemplateVersion' }
        draft: { $ref: '#/components/schemas/ClinicalTemplateVersion' }
    EncounterForm:
      type: object
      properties:
        id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid }
        template: { $ref: '#/components/schemas/ClinicalTemplate' }
        template_version: { $ref: '#/components/schemas/ClinicalTemplateVersion' }
        status: { type: string, enum: [draft, submitted] }
        answers: { type: object, additionalProperties: true }
        revision: { type: integer, minimum: 0 }
        submitted_at: { type: string, format: date-time, nullable: true }
    SaveEncounterForm:
      type: object
      required: [revision, answers]
      properties:
        revision: { type: integer, minimum: 0 }
        answers:
          type: object
          additionalProperties: true

    ServiceCatalogueInput:
      type: object
      required: [code, name, category, requires_order, requires_result]
      properties:
        reference_item_id: { type: string, format: uuid, nullable: true }
        code: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1 }
        category: { type: string, enum: [laboratory, imaging, procedure, nursing_service, consultation, therapy, other] }
        department_id: { type: string, format: uuid, nullable: true }
        service_point_id: { type: string, format: uuid, nullable: true }
        price: { type: number, minimum: 0, nullable: true, description: Facility price in the supplied currency's major unit. }
        currency: { type: string, minLength: 3, maxLength: 3, default: KES }
        requires_order: { type: boolean }
        requires_result: { type: boolean }
        estimated_duration_minutes: { type: integer, minimum: 1, nullable: true }
    MedicationCatalogueInput:
      type: object
      required: [code, generic_name, prescription_required]
      properties:
        reference_item_id: { type: string, format: uuid, nullable: true }
        code: { type: string, minLength: 1, maxLength: 100 }
        generic_name: { type: string, minLength: 1 }
        brand_name: { type: string, nullable: true }
        strength: { type: string, nullable: true }
        dosage_form: { type: string, nullable: true, description: Code of an active entry in /clinical/config/dosage-forms. Common abbreviations ("Tab") are accepted and stored as the configured code. }
        route: { type: string, nullable: true, description: Code of an active entry in /clinical/config/routes. }
        pack_size: { type: string, nullable: true }
        unit_of_measure: { type: string, nullable: true, description: Code of an active entry in /clinical/config/units-of-measure. }
        prescription_required: { type: boolean }
    CatalogueLifecycleRequest:
      type: object
      properties: { reason: { type: string, description: Required when deactivating. } }
    ServiceAdoption:
      type: object
      required: [reference_item_id, code, requires_order, requires_result]
      properties:
        reference_item_id: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        price: { type: number, minimum: 0, nullable: true }
        currency: { type: string, default: KES }
        requires_order: { type: boolean }
        requires_result: { type: boolean }
    MedicationAdoption:
      type: object
      required: [reference_item_id, code, prescription_required]
      properties:
        reference_item_id: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        prescription_required: { type: boolean }
    CatalogueImportPreviewResponse:
      allOf: [{ $ref: "#/components/schemas/SuccessResponse" }]

    ClinicalResource:
      type: object
      required: [id, code, name, active, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        department_id: { type: string, nullable: true, format: uuid }
        ward_id: { type: string, nullable: true, format: uuid }
        room_id: { type: string, nullable: true, format: uuid }
        service_point_id: { type: string, nullable: true, format: uuid }
        kind: { type: string, nullable: true }
        status: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CreateResource:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        department_id: { type: string, format: uuid }
        ward_id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        service_point_id: { type: string, format: uuid }
        kind: { type: string }
    UpdateResource:
      type: object
      minProperties: 1
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        kind: { type: string, minLength: 1, description: Service points only }
    DeactivateResource:
      type: object
      required: [reason, cascade]
      properties:
        reason: { type: string, minLength: 1 }
        cascade: { type: boolean }
    ResourceReference:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string }
        id: { type: string, format: uuid }
        name: { type: string }
    OperationalBlocker:
      type: object
      required: [type, kind, resource_id, name, count, message]
      properties:
        type: { type: string }
        kind: { type: string }
        resource_id: { type: string, format: uuid }
        name: { type: string }
        count: { type: integer, minimum: 1 }
        message: { type: string }
    DeactivationImpact:
      type: object
      required: [root, active_descendants, descendant_counts, operational_blockers, cascade_allowed]
      properties:
        root: { $ref: '#/components/schemas/ResourceReference' }
        active_descendants: { type: array, items: { $ref: '#/components/schemas/ResourceReference' } }
        descendant_counts: { type: object, additionalProperties: { type: integer } }
        operational_blockers: { type: array, items: { $ref: '#/components/schemas/OperationalBlocker' } }
        cascade_allowed: { type: boolean }
    Visit:
      type: object
      required: [id, patient_id, visit_type, status, started_at, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_type: { type: string, enum: [test, outpatient, emergency, specialty] }
        status: { type: string, enum: [planned, active, completed, cancelled] }
        reason: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    CreateVisit:
      type: object
      required: [patient_id, visit_type]
      properties:
        patient_id: { type: string, format: uuid }
        visit_type: { type: string, enum: [test, outpatient, emergency, specialty] }
        reason: { type: string }
    OutpatientCheckIn:
      type: object
      required: [patient_id]
      properties: { patient_id: { type: string, format: uuid }, reason: { type: string } }
    OutpatientCheckInOverride:
      type: object
      required: [patient_id, override_reason]
      properties: { patient_id: { type: string, format: uuid }, reason: { type: string }, override_reason: { type: string, minLength: 1 } }
    CreateEncounter:
      type: object
      required: [encounter_type]
      properties: { encounter_type: { type: string, enum: [triage, consultation] }, service_point_id: { type: string, format: uuid } }
    ObservationInput:
      type: object
      required: [code]
      properties: { code: { type: string }, value_numeric: { type: number }, value_text: { type: string }, unit: { type: string } }
      description: Exactly one of value_numeric and value_text is required.
    RecordObservations:
      type: object
      required: [observations]
      properties: { observations: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/ObservationInput' } } }
    CompleteEncounter:
      type: object
      properties:
        expected_updated_at: { type: string, format: date-time, description: Optional optimistic concurrency value }
    CreateNote:
      type: object
      required: [note_type, body]
      properties: { encounter_id: { type: string, format: uuid }, note_type: { type: string }, body: { type: string, minLength: 1 } }
    CreateDiagnosis:
      type: object
      required: [kind]
      description: concept_id is preferred. code is accepted temporarily and resolved against the active ICD-11 release.
      properties: { encounter_id: { type: string, format: uuid }, concept_id: { type: string, format: uuid }, code: { type: string }, kind: { type: string, enum: [provisional, final, secondary] }, note: { type: string } }
    CreateAllergy:
      type: object
      description: Exactly one of allergen_id or other_allergen is required. allergen remains a deprecated alias for other_allergen.
      properties: { allergen_id: { type: string, format: uuid }, other_allergen: { type: string }, allergen: { type: string, deprecated: true }, reaction: { type: string }, severity: { type: string, enum: [mild, moderate, severe] } }
    AllergenInput:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [medication, food, contrast, contact, insect, environmental, other] }
        aliases: { type: array, items: { type: string } }
    QueueEntry:
      type: object
      required: [id, queue_id, subject_type, subject_id, patient_id, status, priority, joined_at]
      properties:
        id: { type: string, format: uuid }
        queue_id: { type: string, format: uuid }
        queue_name: { type: string }
        service_point_kind:
          description: >
            Kind of the service point the queue is staffed from. triage and consultation
            entries are taken into service through their start endpoint rather than a
            transition, so clients use this to choose the action to offer.
          type: string
        subject_type: { type: string, enum: [visit, admission, order] }
        subject_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        patient_mrn: { type: string }
        status: { type: string, enum: [waiting, called, in_service, paused, transferred, completed, cancelled, no_show] }
        priority: { type: integer, minimum: 0, maximum: 100 }
        acuity: { type: integer, nullable: true, minimum: 1, maximum: 5 }
        joined_at: { type: string, format: date-time }
    Encounter:
      type: object
      required: [id, visit_id, encounter_type, status]
      properties:
        id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        encounter_type: { type: string, enum: [triage, consultation] }
        status: { type: string, enum: [planned, in_progress, completed, cancelled] }
        service_point_id: { type: string, format: uuid, nullable: true }
        clinician_id: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
    EncounterStart:
      description: Everything a client needs to render a clinician's working page after taking a patient into service.
      type: object
      required: [queue_entry, encounter, form]
      properties:
        queue_entry: { $ref: '#/components/schemas/QueueEntry' }
        encounter: { $ref: '#/components/schemas/Encounter' }
        form: { $ref: '#/components/schemas/EncounterForm' }
    Enqueue:
      type: object
      required: [subject_type, subject_id, patient_id, priority]
      properties:
        subject_type: { type: string, enum: [visit, admission, order] }
        subject_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 0, maximum: 100 }
        acuity: { type: integer, minimum: 1, maximum: 5 }
        reason: { type: string }
    TransitionQueueEntry:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [waiting, called, in_service, paused, transferred, completed, cancelled, no_show] }
        queue_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 0, maximum: 100 }
        position: { type: integer }
        reason: { type: string }
    CreateRoutingRule:
      type: object
      required: [name, event_type, target_queue_id, priority]
      properties:
        name: { type: string }
        event_type: { type: string, enum: [visit.created] }
        visit_type: { type: string, enum: [test, outpatient, emergency, specialty] }
        target_queue_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 0, maximum: 100 }
    ResourceResponse: { allOf: [{ $ref: '#/components/schemas/SuccessResponse' }] }
    DeactivationImpactResponse: { allOf: [{ $ref: '#/components/schemas/SuccessResponse' }] }
    ResourceListResponse: { allOf: [{ $ref: '#/components/schemas/SuccessResponse' }] }
    VisitResponse: { allOf: [{ $ref: '#/components/schemas/SuccessResponse' }] }
    QueueEntryResponse: { allOf: [{ $ref: '#/components/schemas/SuccessResponse' }] }
    QueueEntryListResponse: { allOf: [{ $ref: '#/components/schemas/SuccessResponse' }] }
    EncounterStartResponse:
      allOf:
        - { $ref: '#/components/schemas/SuccessResponse' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/EncounterStart' } }

    APIError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string, example: "Validation failed" }
        details:
          description: Optional structured error details, commonly a field-to-message map.
          nullable: true

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { $ref: "#/components/schemas/APIError" }

    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          description: Endpoint-specific response payload.
        meta:
          allOf:
            - { $ref: "#/components/schemas/PaginationMeta" }
          nullable: true

    SlugAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }

    EnrollmentToken:
      type: object
      required: [enrollment_token]
      properties:
        enrollment_token: { type: string }

    LifecycleReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }

    LoginChallenge:
      type: object
      required: [challenge_token, mfa_methods]
      properties:
        challenge_token: { type: string, description: "Short-lived token (5 min), used to complete MFA step" }
        mfa_methods: { type: array, items: { type: string, enum: [totp, webauthn, recovery_code] } }

    AccountLocked:
      type: object
      required: [locked_until, reason]
      properties:
        locked_until: { type: string, format: date-time }
        reason: { type: string, example: "Exceeded maximum failed login attempts" }

    TOTPSetup:
      type: object
      required: [secret, qr_code_uri]
      properties:
        secret: { type: string }
        qr_code_uri: { type: string }

    MFAFactor:
      type: object
      required: [id, type, label, created_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [totp, webauthn] }
        label: { type: string }
        created_at: { type: string, format: date-time }

    PasswordPolicy:
      type: object
      properties:
        min_length: { type: integer, example: 12 }
        require_uppercase: { type: boolean }
        require_number: { type: boolean }
        require_symbol: { type: boolean }
        reject_common_passwords: { type: boolean }
        max_age_days: { type: integer, example: 90 }

    StatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }

    InvitationPreview:
      type: object
      properties:
        full_name: { type: string }
        email: { type: string }
        organization: { type: string }

    SlugAvailabilityResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SlugAvailability" }

    OrganizationResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Organization" }

    EnrollmentTokenResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/EnrollmentToken" }

    LoginChallengeResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LoginChallenge" }

    AccountLockedErrorResponse:
      allOf:
        - { $ref: "#/components/schemas/ErrorResponse" }
        - type: object
          properties:
            error:
              allOf:
                - { $ref: "#/components/schemas/APIError" }
                - type: object
                  properties:
                    details: { $ref: "#/components/schemas/AccountLocked" }

    TokenPairResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TokenPair" }

    UserProfileResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserProfile" }

    UserProfileListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/UserProfile" }

    TOTPSetupResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TOTPSetup" }

    MFAFactorResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MFAFactor" }

    MFAFactorListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/MFAFactor" }

    PasswordPolicyResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PasswordPolicy" }

    StatusSuccessResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/StatusResponse" }

    SessionListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Session" }

    InvitationPreviewResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/InvitationPreview" }

    RoleResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Role" }

    RoleListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Role" }

    AuditLogListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AuditLogEntry" }

    Organization:
      type: object
      properties:
        id: { type: string, description: "tenant_id - referenced by every other resource in this API" }
        organization_name: { type: string }
        slug: { type: string, description: "Immutable subdomain slug" }
        status: { type: string, enum: [pending, active, suspended] }
        created_at: { type: string, format: date-time }

    TokenPair:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: "Access token TTL in seconds" }

    UserProfile:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, description: "Organization this account belongs to. Read-only; derived from the resolving subdomain at account creation and never reassignable." }
        full_name: { type: string }
        username: { type: string }
        email: { type: string }
        provider_identifier: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string }, description: "Effective permissions resolved from roles" }
        status: { type: string, enum: [invited, active, suspended, pending_review, deactivated] }
        deactivated_at: { type: string, format: date-time, nullable: true }
        mfa_enrolled: { type: boolean }
        last_access_review_at: { type: string, format: date-time }
        next_access_review_due: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, description: "Roles are tenant-scoped; a role created by one organization is never visible or assignable in another." }
        name: { type: string }
        description: { type: string }
        is_superuser_role:
          type: boolean
          description: >
            Restricted - only assignable by an existing superuser within the same
            tenant (Reg. 12(b)(iv)). This is a tenant-scoped superuser (full admin
            rights within one organization only), NOT a platform-wide operator role -
            cross-tenant platform administration (e.g. Anthropic-style internal ops
            tooling) is intentionally out of scope for this contract and would live
            behind a separate, non-tenant-resolved internal API.
        requires_provider_identifier:
          type: boolean
          description: >
            True for clinical/healthcare-provider roles (doctor, nurse, clinical
            officer, lab tech) where Reg. 12(b)(v) requires the account be linked
            to a provider identifier issued by the System. False for administrative
            roles (receptionist, accountant, records clerk, IT admin) which need
            system access and RBAC like any staff account, but have no such
            regulatory linkage - inventing an identifier for them would misrepresent
            what the field means.
        permissions: { type: array, items: { type: string }, description: "e.g. patients:read, patients:write, billing:read, admin:users:write" }

    Session:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        device_label: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        current: { type: boolean }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, description: "Present even for pre-auth events (e.g. organization_registered, failed logins) since the tenant is resolved by subdomain before authentication." }
        timestamp: { type: string, format: date-time }
        user_id: { type: string }
        action: { type: string }
        target_resource: { type: string }
        ip_address: { type: string }
        result: { type: string, enum: [success, failure] }
        metadata:
          type: object
          additionalProperties: true

    # ---------------- PATIENT MANAGEMENT ----------------

    Patient:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        mrn: { type: string, description: "Generated server-side, atomically, per tenant. Never client-supplied." }
        full_name: { type: string }
        dob: { type: string, format: date, nullable: true }
        dob_estimated: { type: boolean }
        approx_age_years: { type: integer, nullable: true, description: "Only meaningful for unidentified/emergency intakes where an exact DOB isn't known." }
        gender: { type: string, enum: [male, female, unknown] }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        national_id: { type: string, nullable: true }
        status: { type: string, enum: [active, deceased, merged] }
        date_of_death: { type: string, format: date-time, nullable: true }
        insured: { type: boolean, description: "Simple flag today; not backed by a real SHA/insurer integration yet." }
        guardian_id: { type: string, nullable: true, description: "Self-referencing link to the patient record acting as guardian (minor intake)." }
        merged_into_id: { type: string, nullable: true, description: "Set once this record has been merged away (alias/redirect model). Old MRN lookups should resolve to this ID instead." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PatientResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Patient" }

    PatientListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Patient" }

    GuardianSelection:
      type: object
      required: [mode]
      description: >
        Selects how a minor's guardian is attached during registration.
        mode=existing links patient_id as an already-registered patient.
        mode=new registers a second patient record for the guardian in the
        same request/transaction. mode=none registers the minor without a
        linked guardian.
      properties:
        mode: { type: string, enum: [existing, new, none] }
        patient_id: { type: string, description: "Required when mode=existing." }
        full_name: { type: string, description: "Required when mode=new." }
        dob: { type: string, format: date }
        dob_estimated: { type: boolean }
        gender: { type: string, enum: [male, female, unknown] }
        phone: { type: string }
        national_id: { type: string }
        address: { type: string }

    RegisterPatientRequest:
      type: object
      properties:
        unknown: { type: boolean, description: "Unidentified/emergency intake - only gender and approx_age_years are required; full_name is generated server-side." }
        minor: { type: boolean, description: "Requires guardian to be set." }
        full_name: { type: string }
        dob: { type: string, format: date }
        dob_estimated: { type: boolean }
        gender: { type: string, enum: [male, female, unknown] }
        approx_age_years: { type: integer }
        phone: { type: string }
        address: { type: string }
        national_id: { type: string }
        guardian: { $ref: "#/components/schemas/GuardianSelection" }
        duplicate_override: { type: boolean, description: "Set to true to proceed with registration despite a high-confidence duplicate match returned on a prior 409." }

    PatientDuplicateCandidate:
      type: object
      properties:
        patient: { $ref: "#/components/schemas/Patient" }
        score: { type: number, format: float, description: "Combined trigram-name-similarity + exact-match-boost score." }
        confidence: { type: string, enum: [high, medium, low] }
        matched_on: { type: array, items: { type: string }, description: "Which fields contributed exact-match boosts, e.g. [\"dob\", \"national_id\"]." }

    PatientDuplicateCandidateListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/PatientDuplicateCandidate" }

    MarkDeceasedRequest:
      type: object
      required: [date_of_death]
      properties:
        date_of_death: { type: string, format: date }
        source: { type: string }

    PatientCorrection:
      type: object
      properties:
        id: { type: string }
        patient_id: { type: string }
        field: { type: string, enum: [full_name, dob, gender, national_id] }
        current_value: { type: string, nullable: true }
        requested_value: { type: string }
        evidence_note: { type: string, nullable: true }
        status: { type: string, enum: [pending, actioned, rejected] }
        submitted_by: { type: string, nullable: true }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    PatientCorrectionRequest:
      type: object
      required: [field, requested_value]
      properties:
        field: { type: string, enum: [full_name, dob, gender, national_id] }
        requested_value: { type: string }
        evidence_note: { type: string }

    PatientCorrectionDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [actioned, rejected] }
        decision_note: { type: string }

    PatientCorrectionResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PatientCorrection" }

    PatientCorrectionListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/PatientCorrection" }

    AddPatientIdentifierRequest:
      type: object
      required: [id_type, id_value]
      properties:
        id_type: { type: string, example: "National ID" }
        id_value: { type: string }

    PatientIdentifier:
      type: object
      properties:
        id: { type: string }
        patient_id: { type: string }
        id_type: { type: string }
        id_value: { type: string }
        verified_label: { type: string, description: "\"Pending verification\" until a future verification flow exists." }
        verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PatientIdentifierResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PatientIdentifier" }

    PatientIdentifierListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/PatientIdentifier" }

    SetPatientConsentRequest:
      type: object
      required: [granted]
      properties:
        granted: { type: boolean, description: "Idempotent set, not a relative toggle." }

    PatientConsent:
      type: object
      properties:
        id: { type: string }
        patient_id: { type: string }
        scope: { type: string }
        granted: { type: boolean }
        granted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    PatientConsentResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PatientConsent" }

    PatientConsentListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/PatientConsent" }

    AddPatientActivityNoteRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }

    PatientActivityEntry:
      type: object
      properties:
        id: { type: string }
        patient_id: { type: string }
        user_id: { type: string, nullable: true }
        kind: { type: string, enum: [note, system], description: "note = free-text staff entry; system = generated by another action (consent change, identifier change, mark-deceased, correction decision, merge)." }
        text: { type: string }
        created_at: { type: string, format: date-time }

    PatientActivityEntryResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PatientActivityEntry" }

    PatientActivityEntryListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/PatientActivityEntry" }

    MergePatientsRequest:
      type: object
      required: [keep_patient_id, away_patient_id, reason]
      properties:
        keep_patient_id: { type: string, description: "The record that survives the merge." }
        away_patient_id: { type: string, description: "The record that becomes an alias, redirected to keep_patient_id." }
        reason: { type: string, maxLength: 500 }
