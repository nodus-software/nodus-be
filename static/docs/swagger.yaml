      responses: { '200': { description: Visit summary } }
  /clinical/queues/{queueId}/entries:
    parameters: [{ name: queueId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      security: [{ bearerAuth: [] }]
      summary: List active entries on a queue board
      responses:
        '200': { description: Queue entries, content: { application/json: { schema: { $ref: '#/components/schemas/QueueEntryListResponse' } } } }
    post:
      tags: [Clinical]
      security: [{ bearerAuth: [] }]
      summary: Add a work item to a queue manually
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Enqueue' } } } }
      responses:
        '201': { description: Queue entry, content: { application/json: { schema: { $ref: '#/components/schemas/QueueEntryResponse' } } } }
  /clinical/queue-entries/{entryId}/transition:
    post:
      tags: [Clinical]
      security: [{ bearerAuth: [] }]
      summary: Move or change the state of a queue entry
      description: >
        Requires queues:operate. Entries on a queue whose service point kind is triage or
        consultation cannot be moved to in_service here: taking those patients into service
        must create the encounter and its pinned form, so use the matching start endpoint
        instead. Every other transition, including calling the patient, is unaffected.
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransitionQueueEntry' } } } }
      responses:
        '200': { description: Updated queue entry, content: { application/json: { schema: { $ref: '#/components/schemas/QueueEntryResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Validation failed, or in_service was requested on a triage or consultation queue, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /clinical/queue-entries/{entryId}/start-triage:
    post:
      tags: [Clinical]
      security: [{ bearerAuth: [] }]
      summary: Start triage for a called outpatient queue entry
      description: >
        Requires outpatient:triage. Atomically changes the queue entry from called to
        in_service, starts a triage encounter at the queue's service point, and pins the
        organization's current published default triage template. Calling the patient
        remains a separate queue transition requiring queues:operate.
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201': { description: Started triage encounter and form, content: { application/json: { schema: { $ref: '#/components/schemas/EncounterStartResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /clinical/queue-entries/{entryId}/start-consultation:
    post:
      tags: [Clinical]
      security: [{ bearerAuth: [] }]
      summary: Start consultation for a called outpatient queue entry
      description: >
        Requires outpatient:consult. The consultation counterpart of start-triage: it
        atomically changes the queue entry from called to in_service, starts a consultation
        encounter at the queue's service point, and pins the organization's current published
        default consultation template, so the clinician's page can be rendered from the
        response alone. Calling the patient remains a separate queue transition requiring
        queues:operate. The visit must already have a completed triage encounter — start an
        unusual consultation through POST /clinical/visits/{visitId}/encounters/override
        instead. An entry left in_service without an encounter is picked up rather than
        refused, so a stranded patient can be recovered.
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201': { description: Started consultation encounter and form, content: { application/json: { schema: { $ref: '#/components/schemas/EncounterStartResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A consultation is already open for this visit, or the organization has no published default consultation template, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: The entry is not on a consultation queue, or the visit has no completed triage, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /clinical/queue-entries/{entryId}/history:
