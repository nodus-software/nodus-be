openapi: 3.0.3
info:
  title: HMIS Authentication & Access Control API
  version: "1.1"
  description: >
    Authentication, MFA, RBAC, session, and audit-logging contract designed to satisfy
    the Digital Health (Health Information Management Procedures) Regulations, 2025,
    Regulation 12 (Security of sensitive personal data), and related DHA certification
    requirements: unique authenticated login, mandatory MFA, role-based least-privilege
    access, tamper-proof audit trails, encrypted sessions, and account lockout on
    repeated failed logins.

    ## Multi-tenancy model
    This API is multi-tenant: each facility/company registered via POST /organizations
    is a fully isolated tenant. Tenant identification happens at the transport layer via
    subdomain (the `tenant` server variable below) - it is resolved BEFORE authentication,
    so /auth/login never needs a tenant field in its request body. All tenant data is
    stored in a shared database with a `tenant_id` column enforced by database-level Row
    Level Security (RLS); the tenant_id embedded in a caller's access token (JWT claim
    `tid`) is the sole source of truth for scoping every query - it is never accepted as
    a client-supplied parameter. username/email uniqueness is enforced per-tenant, not
    globally: the same email may hold separate accounts at two different organizations.

    ## Response envelope
    Every JSON response is wrapped by the implementation. Successful responses use
    `{ "success": true, "data": ... }` (and may include `meta` for pagination).
    Error responses use
    `{ "success": false, "error": { "code": "...", "message": "...", "details": ... } }`.
    `204 No Content` responses are the only exception and have an empty body.

servers:
  - url: https://{tenant}.api.nodushealth.com
    description: Tenant-scoped API host. `tenant` resolves the organization for every
      request on this host; there is no cross-tenant routing.
    variables:
      tenant:
        default: acme
        description: Organization subdomain slug, assigned at registration (see
          POST /organizations) and immutable thereafter.
  - url: http://localhost:8080
    description: >
      Local development. Send X-Tenant-Slug with the organization slug on
      tenant-scoped requests because localhost has no tenant subdomain.

tags:
  - name: Health
  - name: Organizations
  - name: Auth
  - name: MFA
  - name: Password
  - name: Sessions
  - name: Users
  - name: Roles
  - name: AuditLog
  - name: Patient Management
  - name: Configuration
  - name: Clinical

paths:

  /health:
    get:
      tags: [Health]
      summary: Check whether the API process is running
      description: Public liveness probe. Does not require tenant resolution or database access.
      responses:
        "200":
          description: The API process is healthy
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [ok] }

  # ---------------- ORGANIZATION (TENANT) REGISTRATION ----------------

  /organizations/check-slug:
    get:
      tags: [Organizations]
      summary: Check whether a subdomain slug is available before submitting registration
      description: >
        Unauthenticated. Used by the signup UI for live validation - slugs are
        immutable once an organization is created, so this lets the founder
        pick one before committing.
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, pattern: "^[a-z0-9-]{3,32}$" } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugAvailabilityResponse" }

  /organizations:
    post:
      tags: [Organizations]
      summary: Self-service registration - creates a new tenant (company) and its founding administrator
      description: >
        Public, unauthenticated. Creates the Organization record and, in the same
        transaction, a UserProfile with an implicit tenant-scoped superuser role
        (is_superuser_role=true, scoped to this tenant only - see the note on
        Role.is_superuser_role). No password is set by this call: exactly like
        /users/invitations, an activation token (24-hour expiry) is emailed
        out-of-band to admin_email, and the founder sets their password and
        completes mandatory MFA enrollment via the same
        /organizations/activations/{token}/accept flow described below. This keeps
        "prove you own this email" and "set a credential" as two separate steps for
        the founding admin, consistent with how every other account in this system
        is provisioned. Logged as an audit event: action=organization_registered
        (tenant_id present, actor=null since no session exists yet).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_name, slug, admin_full_name, admin_email]
              properties:
                organization_name: { type: string }
                slug:
                  type: string
                  pattern: "^[a-z0-9-]{3,32}$"
                  description: "Subdomain slug, e.g. 'acme' for acme.api.nodushealth.com. Immutable after creation."
                admin_full_name: { type: string }
                admin_email: { type: string, format: email }
      responses:
        "201":
          description: Organization created; activation email sent to admin_email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /organizations/activations/{token}/accept:
    post:
      tags: [Organizations]
      summary: Founding admin sets their password and activates the organization
      description: >
        Sets the founding admin's password (validated against
        /auth/password/policy), transitions both the Organization and the admin's
        UserProfile from status=pending to active, and invalidates the activation
        token immediately. As with /users/invitations/{token}/accept, this does NOT
        log the user in - it returns a short-lived enrollment_token scoped only to
        /auth/mfa/totp/setup, since MFA enrollment is mandatory before any real
        login (Reg. 12(a)(iv)). Logged as an audit event: action=organization_activated.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Organization and founding admin activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /organizations/current:
    get:
      tags: [Organizations]
      summary: Get the current tenant's organization profile
      description: Tenant is resolved from the caller's access token (JWT claim `tid`), not a path parameter - there is no way to fetch another tenant's organization record through this API.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationResponse" }
    patch:
      tags: [Organizations]
      summary: Update the current tenant's organization profile (superuser only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_name: { type: string }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationResponse" }

  # ---------------- AUTHENTICATION ----------------

  /auth/login:
    post:
      tags: [Auth]
      summary: Step 1 of login - validate email/password, issue MFA challenge
      description: >
        Tenant is resolved from the request's subdomain (see the `tenant` server
        variable), not from any field in this body. email is checked for
        uniqueness within that tenant only, so the same email may exist under a
        different subdomain belonging to a different organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Credentials valid; MFA challenge required (no session yet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginChallengeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423":
          description: >
            Account locked due to exceeding failed-login threshold. Response includes
            lockout_until timestamp and instructions to contact an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLockedErrorResponse" }

  /auth/login/mfa:
    post:
      tags: [Auth]
      summary: Step 2 of login - verify MFA code, issue session tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, method, code]
              properties:
                challenge_token: { type: string }
                method: { type: string, enum: [totp, recovery_code] }
                code: { type: string, description: "Six-digit TOTP or human-transcribable recovery code" }
                remember_me:
                  type: boolean
                  default: false
                  description: >
                    When true, the refresh-token cookie persists across browser restarts
                    and uses the configured remembered-session lifetime (30 days by
                    default). When false, a browser-session cookie and the shorter
                    session refresh-token lifetime (24 hours by default) are used.
      responses:
        "200":
          description: >
            MFA verified and authenticated session established. The rotating refresh
            token is issued only in an HttpOnly cookie and is not present in the JSON body.
          headers:
            Set-Cookie:
              description: >
                HttpOnly refresh-token cookie. Secure is required in production; SameSite,
                domain, persistence and expiry are controlled by server configuration and
                remember_me.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPairResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Gone" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the HttpOnly refresh cookie and issue a new access token
      description: >
        The request has no JSON body. Browsers must include credentials so the HttpOnly
        refresh cookie is sent. Rotation preserves the remember_me choice and server-side
        lifetime recorded on the session. Invalid, expired, or replayed cookies are cleared.
      security: [{ refreshCookie: [] }]
      responses:
        "200":
          description: New access token issued and refresh cookie rotated
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPairResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login/mfa/webauthn/options:
    post:
      tags: [Auth, MFA]
      summary: Begin passkey/security-key assertion after password verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token]
              properties: { challenge_token: { type: string } }
      responses:
        "200": { description: Server-generated WebAuthn request options and one-time ceremony ID }
        "410": { $ref: "#/components/responses/Gone" }

  /auth/login/mfa/webauthn/verify:
    post:
      tags: [Auth, MFA]
      summary: Verify the complete WebAuthn assertion and establish a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, ceremony_id, credential]
              properties:
                challenge_token: { type: string }
                ceremony_id: { type: string }
                credential: { type: object, additionalProperties: true }
                remember_me: { type: boolean, default: false }
      responses:
        "200": { description: Authenticated session established }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session's refresh token
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Logged out; session revoked, refresh cookie cleared, and event audited

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user's profile and effective permissions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }

  # ---------------- MFA ENROLLMENT ----------------

  /auth/mfa/totp/setup:
    post:
      tags: [MFA]
      summary: Begin TOTP enrollment - returns provisioning QR/secret
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPSetupResponse" }

  /auth/mfa/totp/confirm:
    post:
      tags: [MFA]
      summary: Confirm TOTP enrollment by verifying an initial code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: TOTP enabled as an active MFA factor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSuccessResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/mfa/recovery-codes/status:
    get:
      tags: [MFA]
      summary: Return only the unused recovery-code count
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recovery-code status }

  /auth/mfa/webauthn/register/options:
    post:
      tags: [MFA]
      summary: Begin passkey or security-key registration
      description: Enrollment-token callers provide a label; established sessions also confirm their current password.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 80 }
                current_password: { type: string, format: password }
      responses:
        "200": { description: Server-generated WebAuthn creation options and one-time ceremony ID }

  /auth/mfa/webauthn/register/verify:
    post:
      tags: [MFA]
      summary: Verify registration and create a named WebAuthn factor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony_id, credential]
              properties:
                ceremony_id: { type: string }
                credential: { type: object, additionalProperties: true }
      responses:
        "201": { description: Factor created; first-factor enrollment also returns recovery codes once }

  /auth/mfa/recovery-codes/regenerate:
    post:
      tags: [MFA]
      summary: Invalidate old recovery codes and return replacements once
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties: { current_password: { type: string, format: password } }
      responses:
        "200": { description: New one-time recovery-code set }

  /auth/mfa/factors:
    get:
      tags: [MFA]
      summary: List enrolled MFA factors for the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAFactorListResponse" }

  /auth/mfa/factors/{factorId}/remove:
    post:
      tags: [MFA]
      summary: Remove an MFA factor (requires at least one factor remain enrolled)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: factorId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties: { current_password: { type: string, format: password } }
      responses:
        "204": { description: "Factor removed" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- PASSWORD MANAGEMENT ----------------

  /auth/password/change:
    post:
      tags: [Password]
      summary: Change password while authenticated
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, description: "Must meet complexity policy - see /auth/password/policy" }
      responses:
        "204": { description: "Password changed; all other sessions revoked; logged as audit event" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/password/policy:
    get:
      tags: [Password]
      summary: Retrieve current password complexity requirements (for client-side validation UI)
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordPolicyResponse" }

  /auth/password/reset/request:
    post:
      tags: [Password]
      summary: Request a password reset link/code (unauthenticated)
      description: >
        Reset logic: generates a cryptographically random, single-use token (256-bit),
        stored server-side as a hash (never in plaintext), valid for 15 minutes.
        Token is delivered out-of-band to the email/phone already on file for the
        account - never to an address supplied in this request - so an attacker
        cannot redirect the reset. Rate-limited to 5 requests per username per hour
        and 20 requests per source IP per hour, independent of whether the account
        exists, to blunt both enumeration and flooding. Every call to this endpoint
        is written to the audit log (including attempts for non-existent usernames),
        tagged action=password_reset_requested, so repeated attempts against one
        account are visible to admins even though the response never reveals whether
        the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "202":
          description: >
            Always returns 202 regardless of whether the account exists, and regardless
            of whether the account is locked (a locked account can still have its
            password reset by its owner, but remains locked - see /users/{userId}/unlock
            for admin-side unlock, which is a separate action).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSuccessResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/password/reset/confirm:
    post:
      tags: [Password]
      summary: Complete a password reset using the out-of-band token
      description: >
        Reset logic: token is single-use and is invalidated immediately on first use,
        whether the attempt succeeds or fails, to prevent replay. On success: the new
        password is validated against /auth/password/policy, all existing sessions and
        refresh tokens for the account are revoked, all other unused reset tokens for
        the account are invalidated, and the action is written to the audit log as
        action=password_reset_completed. This endpoint never returns access/refresh
        tokens directly - the user must still complete a fresh login, including the
        MFA step, so a password reset alone can never bypass MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, new_password]
              properties:
                reset_token: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: "Password reset; logged as audit event; all sessions revoked; login (with MFA) required to obtain a new session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}/unlock:
    post:
      tags: [Users]
      summary: Admin-side unlock of an account locked by repeated failed logins
      description: >
        A locked account (see the 423 response on /auth/login) cannot be unlocked by
        the user themselves via password reset - lockout requires explicit admin
        action, consistent with treating repeated failed logins as a security event
        rather than a self-service inconvenience. This clears the lockout counter and
        lockout_until timestamp. It does NOT reset the password or MFA factors -
        those remain the user's own unless separately reset. Logged as an audit event
        with the acting admin's user_id attached.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "Admin's stated reason, stored with the audit entry" }
      responses:
        "204": { description: "Account unlocked" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- SESSION MANAGEMENT ----------------

  /auth/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions/devices for the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }

  /auth/sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: Revoke a specific session (e.g., "log out this device")
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "Session revoked; logged as audit event" }

  # ---------------- USER & ROLE MANAGEMENT (admin) ----------------

  /users:
    get:
      tags: [Users]
      summary: List users (admin only, requires users:read permission)
      description: >
        Scoped to the caller's tenant only (derived from the access token's `tid`
        claim, enforced additionally by database-level RLS) - there is no
        parameter that can expand this query across organizations.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, invited, suspended, pending_review, deactivated] } }
        - { name: stale_access, in: query, schema: { type: boolean }, description: "Users whose access hasn't been reviewed within the quarterly cycle" }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileListResponse" }

  /users/invitations:
    post:
      tags: [Users]
      summary: Invite a new staff user (admin only) - does not create a usable account yet
      description: >
        Onboarding logic: this creates a pending user record with status=invited,
        tenant_id inherited from the inviting admin's own tenant (never
        client-supplied - there is no way to invite a user into a different
        organization than the caller's own). No password exists yet. A single-use invite token (24-hour expiry) is
        generated and delivered out-of-band to the email supplied - never returned
        in this response. The invitee sets their own password and enrolls MFA when
        they accept the invite (see /users/invitations/{token}/accept), so no
        shared secret ever passes through the admin's hands. Logged as an audit
        event: action=user_invited, actor=inviting admin.

        provider_identifier is conditionally required: the server checks whether
        any role in role_ids has requires_provider_identifier=true (e.g. Doctor,
        Nurse, Clinical Officer). If so, provider_identifier must be present and
        is stored as attested by the inviting admin (not yet verified against a
        registry). If every assigned role has requires_provider_identifier=false
        (e.g. Receptionist, Accountant, Records Clerk), provider_identifier is
        omitted entirely - it is not a required or even meaningful field for
        those accounts. A user whose roles later change from non-clinical to
        clinical (e.g. promoted, or given a dual role) will be required to supply
        a provider_identifier at that point via PATCH /users/{userId}.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, role_ids]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                provider_identifier:
                  type: string
                  description: >
                    Required only if role_ids includes a role with
                    requires_provider_identifier=true. Omit for purely
                    administrative roles.
                role_ids: { type: array, items: { type: string } }
      responses:
        "201":
          description: Invitation created and sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/invitations/{token}:
    get:
      tags: [Users]
      summary: Validate an invite token before showing the accept-invite page (unauthenticated)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreviewResponse" }
        "410": { $ref: "#/components/responses/Gone" }

  /users/invitations/{token}/accept:
    post:
      tags: [Users]
      summary: Accept an invitation - set initial password and complete account activation
      description: >
        Sets the account's password (validated against /auth/password/policy),
        transitions status from invited to active, and invalidates the invite
        token immediately. Does NOT log the user in directly - after this call,
        the user is redirected to MFA enrollment (mandatory before first real
        login, per Reg. 12(a)(iv)), then to normal login. Logged as an audit
        event: action=invitation_accepted.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: >
            Account activated. Returns a short-lived enrollment_token (separate from
            a real session) scoped only to complete MFA setup at /auth/mfa/totp/setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /users/invitations/{token}/resend:
    post:
      tags: [Users]
      summary: Admin resends an invitation (invalidates the prior token, issues a new one)
      description: >
        The current implementation uses the path value as the invited user's ID;
        administrators never receive the raw invitation secret.
      parameters:
        - { name: token, in: path, required: true, description: Invited user ID, schema: { type: string } }
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: "New invitation sent; prior token invalidated" }

  /users/invitations/{userId}/cancel:
    post:
      tags: [Users]
      summary: Cancel an unaccepted staff invitation
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleReasonRequest" }
      responses:
        "204": { description: Invitation cancelled and pending account removed }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}:
    patch:
      tags: [Users]
      summary: Update a user's details, roles, or status (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_ids: { type: array, items: { type: string } }
                status: { type: string, enum: [active, suspended] }
                provider_identifier:
                  type: string
                  description: Required when assigning a role that requires a provider identifier.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }

  /users/{userId}/access-review:
    post:
      tags: [Users]
      summary: Record a quarterly access review decision for this user (Reg. 12(b)(iii))
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision, reviewed_by]
              properties:
                decision: { type: string, enum: [confirm_access, revoke_access, modify_access] }
                reviewed_by: { type: string, description: Authenticated reviewer's user ID }
                notes: { type: string }
      responses:
        "200":
          description: Review recorded; logged as audit event; sets next review due date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }

  /users/{userId}/deactivate:
    post:
      tags: [Users]
      summary: Permanently deactivate a staff account while retaining record attribution
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleReasonRequest" }
      responses:
        "200":
          description: Account deactivated and all credentials revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/reactivate:
    post:
      tags: [Users]
      summary: Issue a one-time link for fresh password and MFA setup
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleReasonRequest" }
      responses:
        "204": { description: Reactivation link sent; account remains deactivated }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/reactivations/{token}:
    get:
      tags: [Users]
      summary: Validate a reactivation token
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Reactivation token is valid }
        "410": { $ref: "#/components/responses/Gone" }

  /users/reactivations/{token}/accept:
    post:
      tags: [Users]
      summary: Set a fresh password and begin mandatory MFA reenrollment
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Account reactivated; returns an MFA enrollment token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenResponse" }
        "410": { $ref: "#/components/responses/Gone" }

  /roles:
    get:
      tags: [Roles]
      summary: List all roles and their permission sets
      description: Scoped to the caller's tenant; roles are never shared across organizations.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleListResponse" }
    post:
      tags: [Roles]
      summary: Create a new role (superuser/admin only - restricted per Reg. 12(b)(iv))
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleResponse" }

  # ---------------- AUDIT LOG ----------------

  /audit-logs:
    get:
      tags: [AuditLog]
      summary: >
        Query the tamper-proof audit trail (Reg. 12(c)). Append-only at the storage
        layer; this endpoint is read-only - there is no update or delete operation
        anywhere in this API for audit records. Scoped to the caller's tenant only;
        an admin can never query another organization's audit trail through this API.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: "e.g. login_failed, login_success, password_changed, mfa_factor_removed, role_changed" }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogListResponse" }

  # ---------------- PATIENT MANAGEMENT ----------------
  # Registering, listing/searching, and merging patient records within the
  # caller's own tenant/facility. Deliberately excludes cross-facility/
  # cross-tenant patient search (a separate, national-registry-style
  # capability) - every endpoint here is scoped to the caller's tenant only,
  # the same as every other domain in this contract.

  /patients:
    get:
      tags: [Patient Management]
      summary: List/search patients (requires patients:read)
      description: >
        Scoped to the caller's tenant only. status, gender, and insurance
        accept comma-separated values for multi-select filtering (e.g.
        status=active,deceased). q matches full_name, mrn, national_id, and
        phone. This is the first endpoint in the API to actually populate
        the meta pagination envelope - page/perPage/total/totalPages are all
        present in the response.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Matches full_name, mrn, national_id, phone" }
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated: active,deceased,merged" }
        - { name: gender, in: query, schema: { type: string }, description: "Comma-separated: male,female,unknown" }
        - { name: insurance, in: query, schema: { type: string }, description: "Comma-separated: insured,uninsured" }
        - { name: regFrom, in: query, schema: { type: string, format: date } }
        - { name: regTo, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientListResponse" }
    post:
      tags: [Patient Management]
      summary: Register a new patient (requires patients:write)
      description: >
        Supports three intake modes: normal, unknown/unidentified
        (unknown=true - only gender and approx_age_years are required,
        full_name is generated server-side as "Unknown {Gender}, approx.
        {age} yrs"), and minor (minor=true - requires a guardian selection,
        either linking an existing patient or registering a new guardian
        patient inline in the same request; both rows are created
        atomically in one transaction). mrn is always generated server-side,
        atomically, per tenant - never client-supplied.

        Runs the same similarity search as GET /patients/duplicate-check as
        a server-side guard: if a high-confidence match exists and
        duplicate_override is not set to true, the request is rejected with
        409 and the candidate(s) are returned in error.details rather than
        silently blocked outright - staff may legitimately be registering a
        different person who happens to share a name/DOB. Logged as an
        audit event: action=patient_registered.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPatientRequest" }
      responses:
        "201":
          description: Patient (and guardian, if newly created) registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /patients/export:
    get:
      tags: [Patient Management]
      summary: Export the patient list (requires patients:read)
      description: >
        Accepts the same search/filter query parameters as GET /patients,
        plus a required format. Streams the file directly in the response
        (no background job/queue - the result set is capped to keep this
        synchronous-safe). Logged as an audit event:
        action=patient_list_exported, since bulk export is the
        highest-risk PII read in this domain.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv] }, description: "xlsx and pdf are planned but not yet implemented" }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: gender, in: query, schema: { type: string } }
        - { name: insurance, in: query, schema: { type: string } }
        - { name: regFrom, in: query, schema: { type: string, format: date } }
        - { name: regTo, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: File stream
          content:
            text/csv:
              schema: { type: string, format: binary }

  /patients/duplicate-check:
    get:
      tags: [Patient Management]
      summary: Search for possible duplicate patients (requires patients:read)
      description: >
        Ranks existing (non-merged) patients in the tenant by a combined
        Postgres trigram name-similarity score plus exact-match boosts for
        DOB, national_id, and phone. Returns a ranked candidate list, not a
        single match - the caller decides what to do with medium/low
        confidence results. The same search backs the server-side guard on
        POST /patients.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: full_name, in: query, required: true, schema: { type: string } }
        - { name: dob, in: query, schema: { type: string, format: date } }
        - { name: national_id, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDuplicateCandidateListResponse" }

  /patients/{patientId}:
    get:
      tags: [Patient Management]
      summary: Get a single patient by ID (requires patients:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{patientId}/contact:
    patch:
      tags: [Patient Management]
      summary: Update a patient's phone/address (requires patients:write)
      description: >
        Only phone and address are directly editable. Legal name, DOB,
        gender, and national_id are protected fields that can only change
        via a submitted-then-decided correction request - see
        POST /patients/{patientId}/corrections.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                address: { type: string }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{patientId}/mark-deceased:
    post:
      tags: [Patient Management]
      summary: Mark a patient as deceased (requires patients:write)
      description: Logged as an audit event (action=patient_marked_deceased).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkDeceasedRequest" }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{patientId}/corrections:
    get:
      tags: [Patient Management]
      summary: List correction requests for a patient (requires patients:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientCorrectionListResponse" }
    post:
      tags: [Patient Management]
      summary: Submit a correction request for a protected field (requires patients:write)
      description: >
        field must be one of full_name, dob, gender, national_id. Creates a
        pending correction; it has no effect on the patient record until
        actioned via POST /patients/corrections/{correctionId}/action.
        Logged as an audit event: action=patient_correction_submitted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientCorrectionRequest" }
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientCorrectionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /patients/corrections/{correctionId}/action:
    post:
      tags: [Patient Management]
      summary: Action or reject a pending correction request (requires patients:write)
      description: >
        Actioning writes requested_value onto the patient's protected
        field; rejecting leaves the patient record untouched. Only valid on
        a correction that is still pending. Logged as an audit event:
        action=patient_correction_decided.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: correctionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientCorrectionDecisionRequest" }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientCorrectionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /patients/{patientId}/identifiers:
    get:
      tags: [Patient Management]
      summary: List a patient's identifiers (requires patients:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientIdentifierListResponse" }
    post:
      tags: [Patient Management]
      summary: Add an identifier to a patient (requires patients:write)
      description: >
        New identifiers always start unverified (verified_label="Pending
        verification") - there is no automated verification flow yet.
        Logged as an audit event: action=patient_identifier_added.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddPatientIdentifierRequest" }
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientIdentifierResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{patientId}/identifiers/{identifierId}:
    delete:
      tags: [Patient Management]
      summary: Remove an identifier from a patient (requires patients:write)
      description: Logged as an audit event (action=patient_identifier_removed).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
        - { name: identifierId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Identifier removed }

  /patients/{patientId}/consents:
    get:
      tags: [Patient Management]
      summary: List a patient's consents (requires patients:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientConsentListResponse" }

  /patients/{patientId}/consents/{scope}:
    put:
      tags: [Patient Management]
      summary: Set a patient's consent for a scope (requires patients:write)
      description: >
        Idempotent set, not a relative toggle - granted reflects the
        desired end state. Logged as an audit event:
        action=patient_consent_updated.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
        - { name: scope, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPatientConsentRequest" }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientConsentResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{patientId}/activity:
    get:
      tags: [Patient Management]
      summary: List a patient's activity log (requires patients:read)
      description: >
        Combines free-text staff notes with system-generated entries
        (consent changes, identifier changes, mark-deceased, correction
        decisions, merges), most recent first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientActivityEntryListResponse" }
    post:
      tags: [Patient Management]
      summary: Add a free-text activity note to a patient (requires patients:write)
      description: >
        The author is always derived from the authenticated caller
        (AuthContext.UserID) - user_id is never client-supplied.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddPatientActivityNoteRequest" }
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientActivityEntryResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/merge:
    post:
      tags: [Patient Management]
      summary: Merge two patient records (requires patients:merge)
      description: >
        Uses an alias/redirect model, not deletion: the away record is kept
        (never deleted) but marked status=merged with merged_into_id
        pointing at the keep record, so old MRN lookups can still resolve
        and redirect. All of the away record's identifiers, consents,
        correction requests, and activity log entries are reassigned to
        the keep record. This is also the resolution path once an
        unidentified/emergency-intake patient's real identity becomes
        known and a separate existing record for that person is found -
        register the unidentified record as away and the real record as
        keep. Requires its own permission (patients:merge, distinct from
        patients:write) since it is destructive and hard to reverse.
        Logged as an audit event: action=patient_merged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergePatientsRequest" }
      responses:
        "200":
          description: Merge complete - returns the surviving (kept) patient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /clinical/config/templates:
    get:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: List clinical templates and their current draft/published versions
      parameters:
        - { name: encounter_type, in: query, schema: { type: string, enum: [triage, consultation] } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
      responses: { '200': { description: Template list } }
    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Create a clinical template with its first draft
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClinicalTemplate' } } } }
      responses: { '201': { description: Template created } }
  /clinical/config/templates/{templateId}:
    get:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Get a clinical template
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Template } }
  /clinical/config/templates/{templateId}/draft:
    parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Copy the published template into a new draft
      responses: { '201': { description: Draft created }, '409': { $ref: '#/components/responses/Conflict' } }
    put:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Replace a template draft
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateClinicalTemplateDraft' } } } }
      responses: { '200': { description: Draft updated }, '422': { $ref: '#/components/responses/ValidationError' } }
  /clinical/config/templates/{templateId}/publish:
    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Publish the current immutable template draft
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Published template }, '409': { $ref: '#/components/responses/Conflict' } }
  /clinical/config/templates/{templateId}/default:
    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Make a published template the encounter-type default
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Default changed }, '409': { $ref: '#/components/responses/Conflict' } }
  /clinical/config/templates/{templateId}/archive:
    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Archive a non-default template
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '200': { description: Archived template }, '409': { $ref: '#/components/responses/Conflict' } }

  /clinical/config/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
