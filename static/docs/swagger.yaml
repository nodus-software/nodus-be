    post:
      tags: [Configuration]
      security: [{ bearerAuth: [] }]
      summary: Create a configured clinical resource
      description: Rooms require `ward_id` and their codes are unique within that ward. Beds require `room_id`, their `ward_id` is derived from the room, and their codes are unique within that room. Flat reference lists (dosage forms, routes, units, prescription frequencies and specimen types) are tenant-owned; their codes and names are case-insensitively unique within a tenant.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateResource' } } } }
