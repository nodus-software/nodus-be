openapi: 3.0.3
info:
  title: HMIS Authentication & Access Control API
  version: "1.1"
  description: >
    Authentication, MFA, RBAC, session, and audit-logging contract designed to satisfy
    the Digital Health (Health Information Management Procedures) Regulations, 2025,
    Regulation 12 (Security of sensitive personal data), and related DHA certification
    requirements: unique authenticated login, mandatory MFA, role-based least-privilege
    access, tamper-proof audit trails, encrypted sessions, and account lockout on
    repeated failed logins.

    ## Multi-tenancy model
    This API is multi-tenant: each facility/company registered via POST /organizations
    is a fully isolated tenant. Tenant identification happens at the transport layer via
    subdomain (the `tenant` server variable below) - it is resolved BEFORE authentication,
    so /auth/login never needs a tenant field in its request body. All tenant data is
    stored in a shared database with a `tenant_id` column enforced by database-level Row
    Level Security (RLS); the tenant_id embedded in a caller's access token (JWT claim
    `tid`) is the sole source of truth for scoping every query - it is never accepted as
    a client-supplied parameter. username/email uniqueness is enforced per-tenant, not
    globally: the same email may hold separate accounts at two different organizations.

    ## Response envelope
    Every JSON response is wrapped by the implementation. Successful responses use
    `{ "success": true, "data": ... }` (and may include `meta` for pagination).
    Error responses use
    `{ "success": false, "error": { "code": "...", "message": "...", "details": ... } }`.
    `204 No Content` responses are the only exception and have an empty body.

servers:
  - url: https://{tenant}.api.nodushealth.com
    description: Tenant-scoped API host. `tenant` resolves the organization for every
      request on this host; there is no cross-tenant routing.
    variables:
      tenant:
        default: acme
        description: Organization subdomain slug, assigned at registration (see
          POST /organizations) and immutable thereafter.
  - url: http://localhost:8080
    description: >
      Local development. Send X-Tenant-Slug with the organization slug on
      tenant-scoped requests because localhost has no tenant subdomain.

tags:
  - name: Health
  - name: Organizations
  - name: Auth
  - name: MFA
  - name: Password
  - name: Sessions
  - name: Users
  - name: Roles
  - name: AuditLog

paths:

  /health:
    get:
      tags: [Health]
      summary: Check whether the API process is running
      description: Public liveness probe. Does not require tenant resolution or database access.
      responses:
        "200":
          description: The API process is healthy
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [ok] }

  # ---------------- ORGANIZATION (TENANT) REGISTRATION ----------------

  /organizations/check-slug:
    get:
      tags: [Organizations]
      summary: Check whether a subdomain slug is available before submitting registration
      description: >
        Unauthenticated. Used by the signup UI for live validation - slugs are
        immutable once an organization is created, so this lets the founder
        pick one before committing.
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, pattern: "^[a-z0-9-]{3,32}$" } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugAvailabilityResponse" }

  /organizations:
    post:
      tags: [Organizations]
      summary: Self-service registration - creates a new tenant (company) and its founding administrator
      description: >
        Public, unauthenticated. Creates the Organization record and, in the same
        transaction, a UserProfile with an implicit tenant-scoped superuser role
        (is_superuser_role=true, scoped to this tenant only - see the note on
        Role.is_superuser_role). No password is set by this call: exactly like
        /users/invitations, an activation token (24-hour expiry) is emailed
        out-of-band to admin_email, and the founder sets their password and
        completes mandatory MFA enrollment via the same
        /organizations/activations/{token}/accept flow described below. This keeps
        "prove you own this email" and "set a credential" as two separate steps for
        the founding admin, consistent with how every other account in this system
        is provisioned. Logged as an audit event: action=organization_registered
        (tenant_id present, actor=null since no session exists yet).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_name, slug, admin_full_name, admin_email]
              properties:
                organization_name: { type: string }
                slug:
                  type: string
                  pattern: "^[a-z0-9-]{3,32}$"
                  description: "Subdomain slug, e.g. 'acme' for acme.api.nodushealth.com. Immutable after creation."
                admin_full_name: { type: string }
                admin_email: { type: string, format: email }
      responses:
        "201":
          description: Organization created; activation email sent to admin_email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /organizations/activations/{token}/accept:
    post:
      tags: [Organizations]
      summary: Founding admin sets their password and activates the organization
      description: >
        Sets the founding admin's password (validated against
        /auth/password/policy), transitions both the Organization and the admin's
        UserProfile from status=pending to active, and invalidates the activation
        token immediately. As with /users/invitations/{token}/accept, this does NOT
        log the user in - it returns a short-lived enrollment_token scoped only to
        /auth/mfa/totp/setup, since MFA enrollment is mandatory before any real
        login (Reg. 12(a)(iv)). Logged as an audit event: action=organization_activated.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Organization and founding admin activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /organizations/current:
    get:
      tags: [Organizations]
      summary: Get the current tenant's organization profile
      description: Tenant is resolved from the caller's access token (JWT claim `tid`), not a path parameter - there is no way to fetch another tenant's organization record through this API.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationResponse" }
    patch:
      tags: [Organizations]
      summary: Update the current tenant's organization profile (superuser only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_name: { type: string }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationResponse" }

  # ---------------- AUTHENTICATION ----------------

  /auth/login:
    post:
      tags: [Auth]
      summary: Step 1 of login - validate email/password, issue MFA challenge
      description: >
        Tenant is resolved from the request's subdomain (see the `tenant` server
        variable), not from any field in this body. email is checked for
        uniqueness within that tenant only, so the same email may exist under a
        different subdomain belonging to a different organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Credentials valid; MFA challenge required (no session yet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginChallengeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423":
          description: >
            Account locked due to exceeding failed-login threshold. Response includes
            lockout_until timestamp and instructions to contact an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLockedErrorResponse" }

  /auth/login/mfa:
    post:
      tags: [Auth]
      summary: Step 2 of login - verify MFA code, issue session tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, method, code]
              properties:
                challenge_token: { type: string }
                method: { type: string, enum: [totp, biometric] }
                code: { type: string, description: "TOTP code, or biometric assertion payload" }
      responses:
        "200":
          description: MFA verified; authenticated session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPairResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Gone" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a valid refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPairResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session's refresh token
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Logged out; session revoked and logged in audit trail

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user's profile and effective permissions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }

  # ---------------- MFA ENROLLMENT ----------------

  /auth/mfa/totp/setup:
    post:
      tags: [MFA]
      summary: Begin TOTP enrollment - returns provisioning QR/secret
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPSetupResponse" }

  /auth/mfa/totp/confirm:
    post:
      tags: [MFA]
      summary: Confirm TOTP enrollment by verifying an initial code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: TOTP enabled as an active MFA factor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSuccessResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/mfa/biometric/register:
    post:
      tags: [MFA]
      summary: Register a biometric factor (optional secondary factor per Reg. 12(a)(v))
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_public_key: { type: string, description: "WebAuthn/platform-authenticator public key" }
                device_label: { type: string }
      responses:
        "201":
          description: Biometric factor registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAFactorResponse" }

  /auth/mfa/factors:
    get:
      tags: [MFA]
      summary: List enrolled MFA factors for the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAFactorListResponse" }

  /auth/mfa/factors/{factorId}:
    delete:
      tags: [MFA]
      summary: Remove an MFA factor (requires at least one factor remain enrolled)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: factorId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "Factor removed" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- PASSWORD MANAGEMENT ----------------

  /auth/password/change:
    post:
      tags: [Password]
      summary: Change password while authenticated
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, description: "Must meet complexity policy - see /auth/password/policy" }
      responses:
        "204": { description: "Password changed; all other sessions revoked; logged as audit event" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/password/policy:
    get:
      tags: [Password]
      summary: Retrieve current password complexity requirements (for client-side validation UI)
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordPolicyResponse" }

  /auth/password/reset/request:
    post:
      tags: [Password]
      summary: Request a password reset link/code (unauthenticated)
      description: >
        Reset logic: generates a cryptographically random, single-use token (256-bit),
        stored server-side as a hash (never in plaintext), valid for 15 minutes.
        Token is delivered out-of-band to the email/phone already on file for the
        account - never to an address supplied in this request - so an attacker
        cannot redirect the reset. Rate-limited to 5 requests per username per hour
        and 20 requests per source IP per hour, independent of whether the account
        exists, to blunt both enumeration and flooding. Every call to this endpoint
        is written to the audit log (including attempts for non-existent usernames),
        tagged action=password_reset_requested, so repeated attempts against one
        account are visible to admins even though the response never reveals whether
        the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "202":
          description: >
            Always returns 202 regardless of whether the account exists, and regardless
            of whether the account is locked (a locked account can still have its
            password reset by its owner, but remains locked - see /users/{userId}/unlock
            for admin-side unlock, which is a separate action).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSuccessResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/password/reset/confirm:
    post:
      tags: [Password]
      summary: Complete a password reset using the out-of-band token
      description: >
        Reset logic: token is single-use and is invalidated immediately on first use,
        whether the attempt succeeds or fails, to prevent replay. On success: the new
        password is validated against /auth/password/policy, all existing sessions and
        refresh tokens for the account are revoked, all other unused reset tokens for
        the account are invalidated, and the action is written to the audit log as
        action=password_reset_completed. This endpoint never returns access/refresh
        tokens directly - the user must still complete a fresh login, including the
        MFA step, so a password reset alone can never bypass MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, new_password]
              properties:
                reset_token: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: "Password reset; logged as audit event; all sessions revoked; login (with MFA) required to obtain a new session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}/unlock:
    post:
      tags: [Users]
      summary: Admin-side unlock of an account locked by repeated failed logins
      description: >
        A locked account (see the 423 response on /auth/login) cannot be unlocked by
        the user themselves via password reset - lockout requires explicit admin
        action, consistent with treating repeated failed logins as a security event
        rather than a self-service inconvenience. This clears the lockout counter and
        lockout_until timestamp. It does NOT reset the password or MFA factors -
        those remain the user's own unless separately reset. Logged as an audit event
        with the acting admin's user_id attached.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "Admin's stated reason, stored with the audit entry" }
      responses:
        "204": { description: "Account unlocked" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- SESSION MANAGEMENT ----------------

  /auth/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions/devices for the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }

  /auth/sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: Revoke a specific session (e.g., "log out this device")
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "Session revoked; logged as audit event" }

  # ---------------- USER & ROLE MANAGEMENT (admin) ----------------

  /users:
    get:
      tags: [Users]
      summary: List users (admin only, requires users:read permission)
      description: >
        Scoped to the caller's tenant only (derived from the access token's `tid`
        claim, enforced additionally by database-level RLS) - there is no
        parameter that can expand this query across organizations.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, invited, suspended, pending_review] } }
        - { name: stale_access, in: query, schema: { type: boolean }, description: "Users whose access hasn't been reviewed within the quarterly cycle" }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileListResponse" }

  /users/invitations:
    post:
      tags: [Users]
      summary: Invite a new staff user (admin only) - does not create a usable account yet
      description: >
        Onboarding logic: this creates a pending user record with status=invited,
        tenant_id inherited from the inviting admin's own tenant (never
        client-supplied - there is no way to invite a user into a different
        organization than the caller's own). No password exists yet. A single-use invite token (24-hour expiry) is
        generated and delivered out-of-band to the email supplied - never returned
        in this response. The invitee sets their own password and enrolls MFA when
        they accept the invite (see /users/invitations/{token}/accept), so no
        shared secret ever passes through the admin's hands. Logged as an audit
        event: action=user_invited, actor=inviting admin.

        provider_identifier is conditionally required: the server checks whether
        any role in role_ids has requires_provider_identifier=true (e.g. Doctor,
        Nurse, Clinical Officer). If so, provider_identifier must be present and
        is stored as attested by the inviting admin (not yet verified against a
        registry). If every assigned role has requires_provider_identifier=false
        (e.g. Receptionist, Accountant, Records Clerk), provider_identifier is
        omitted entirely - it is not a required or even meaningful field for
        those accounts. A user whose roles later change from non-clinical to
        clinical (e.g. promoted, or given a dual role) will be required to supply
        a provider_identifier at that point via PATCH /users/{userId}.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, role_ids]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                provider_identifier:
                  type: string
                  description: >
                    Required only if role_ids includes a role with
                    requires_provider_identifier=true. Omit for purely
                    administrative roles.
                role_ids: { type: array, items: { type: string } }
      responses:
        "201":
          description: Invitation created and sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/invitations/{token}:
    get:
      tags: [Users]
      summary: Validate an invite token before showing the accept-invite page (unauthenticated)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreviewResponse" }
        "410": { $ref: "#/components/responses/Gone" }

  /users/invitations/{token}/accept:
    post:
      tags: [Users]
      summary: Accept an invitation - set initial password and complete account activation
      description: >
        Sets the account's password (validated against /auth/password/policy),
        transitions status from invited to active, and invalidates the invite
        token immediately. Does NOT log the user in directly - after this call,
        the user is redirected to MFA enrollment (mandatory before first real
        login, per Reg. 12(a)(iv)), then to normal login. Logged as an audit
        event: action=invitation_accepted.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: >
            Account activated. Returns a short-lived enrollment_token (separate from
            a real session) scoped only to complete MFA setup at /auth/mfa/totp/setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /users/invitations/{token}/resend:
    post:
      tags: [Users]
      summary: Admin resends an invitation (invalidates the prior token, issues a new one)
      description: >
        The current implementation uses the path value as the invited user's ID;
        administrators never receive the raw invitation secret.
      parameters:
        - { name: token, in: path, required: true, description: Invited user ID, schema: { type: string } }
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: "New invitation sent; prior token invalidated" }

  /users/{userId}:
    patch:
      tags: [Users]
      summary: Update a user's details, roles, or status (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_ids: { type: array, items: { type: string } }
                status: { type: string, enum: [active, suspended] }
                provider_identifier:
                  type: string
                  description: Required when assigning a role that requires a provider identifier.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }

  /users/{userId}/access-review:
    post:
      tags: [Users]
      summary: Record a quarterly access review decision for this user (Reg. 12(b)(iii))
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision, reviewed_by]
              properties:
                decision: { type: string, enum: [confirm_access, revoke_access, modify_access] }
                reviewed_by: { type: string, description: Authenticated reviewer's user ID }
                notes: { type: string }
      responses:
        "200":
          description: Review recorded; logged as audit event; sets next review due date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }

  /roles:
    get:
      tags: [Roles]
      summary: List all roles and their permission sets
      description: Scoped to the caller's tenant; roles are never shared across organizations.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleListResponse" }
    post:
      tags: [Roles]
      summary: Create a new role (superuser/admin only - restricted per Reg. 12(b)(iv))
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleResponse" }

  # ---------------- AUDIT LOG ----------------

  /audit-logs:
    get:
      tags: [AuditLog]
      summary: >
        Query the tamper-proof audit trail (Reg. 12(c)). Append-only at the storage
        layer; this endpoint is read-only - there is no update or delete operation
        anywhere in this API for audit records. Scoped to the caller's tenant only;
        an admin can never query another organization's audit trail through this API.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: "e.g. login_failed, login_success, password_changed, mfa_factor_removed, role_changed" }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogListResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantSlugHeader:
      name: X-Tenant-Slug
      in: header
      required: false
      description: Local-development substitute for the tenant subdomain. Do not send in production.
      schema: { type: string, pattern: "^[a-z0-9-]{3,32}$" }

  responses:
    BadRequest:
      description: Invalid request body, tenant, token, or request parameter
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication failed or the session/token is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated caller lacks the required permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The requested tenant or tenant-scoped resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The requested state conflicts with an existing resource or invariant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Request field validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Gone:
      description: The supplied one-time token has expired or was consumed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    APIError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string, example: "Validation failed" }
        details:
          description: Optional structured error details, commonly a field-to-message map.
          nullable: true

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { $ref: "#/components/schemas/APIError" }

    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          description: Endpoint-specific response payload.
        meta:
          allOf:
            - { $ref: "#/components/schemas/PaginationMeta" }
          nullable: true

    SlugAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }

    EnrollmentToken:
      type: object
      required: [enrollment_token]
      properties:
        enrollment_token: { type: string }

    LoginChallenge:
      type: object
      required: [challenge_token, mfa_methods]
      properties:
        challenge_token: { type: string, description: "Short-lived token (5 min), used to complete MFA step" }
        mfa_methods: { type: array, items: { type: string, enum: [totp, biometric] } }

    AccountLocked:
      type: object
      required: [locked_until, reason]
      properties:
        locked_until: { type: string, format: date-time }
        reason: { type: string, example: "Exceeded maximum failed login attempts" }

    TOTPSetup:
      type: object
      required: [secret, qr_code_uri, backup_codes]
      properties:
        secret: { type: string }
        qr_code_uri: { type: string }
        backup_codes: { type: array, items: { type: string }, description: "One-time-use recovery codes, shown once" }

    MFAFactor:
      type: object
      required: [id, type, label, created_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [totp, biometric] }
        label: { type: string }
        created_at: { type: string, format: date-time }

    PasswordPolicy:
      type: object
      properties:
        min_length: { type: integer, example: 12 }
        require_uppercase: { type: boolean }
        require_number: { type: boolean }
        require_symbol: { type: boolean }
        reject_common_passwords: { type: boolean }
        max_age_days: { type: integer, example: 90 }

    StatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }

    InvitationPreview:
      type: object
      properties:
        full_name: { type: string }
        email: { type: string }
        organization: { type: string }

    SlugAvailabilityResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SlugAvailability" }

    OrganizationResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Organization" }

    EnrollmentTokenResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/EnrollmentToken" }

    LoginChallengeResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LoginChallenge" }

    AccountLockedErrorResponse:
      allOf:
        - { $ref: "#/components/schemas/ErrorResponse" }
        - type: object
          properties:
            error:
              allOf:
                - { $ref: "#/components/schemas/APIError" }
                - type: object
                  properties:
                    details: { $ref: "#/components/schemas/AccountLocked" }

    TokenPairResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TokenPair" }

    UserProfileResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserProfile" }

    UserProfileListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/UserProfile" }

    TOTPSetupResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TOTPSetup" }

    MFAFactorResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MFAFactor" }

    MFAFactorListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/MFAFactor" }

    PasswordPolicyResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PasswordPolicy" }

    StatusSuccessResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/StatusResponse" }

    SessionListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Session" }

    InvitationPreviewResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/InvitationPreview" }

    RoleResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Role" }

    RoleListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Role" }

    AuditLogListResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/AuditLogEntry" }

    Organization:
      type: object
      properties:
        id: { type: string, description: "tenant_id - referenced by every other resource in this API" }
        organization_name: { type: string }
        slug: { type: string, description: "Immutable subdomain slug" }
        status: { type: string, enum: [pending, active, suspended] }
        created_at: { type: string, format: date-time }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: "Access token TTL in seconds" }

    UserProfile:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, description: "Organization this account belongs to. Read-only; derived from the resolving subdomain at account creation and never reassignable." }
        full_name: { type: string }
        username: { type: string }
        email: { type: string }
        provider_identifier: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string }, description: "Effective permissions resolved from roles" }
        status: { type: string, enum: [invited, active, suspended, pending_review] }
        mfa_enrolled: { type: boolean }
        last_access_review_at: { type: string, format: date-time }
        next_access_review_due: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, description: "Roles are tenant-scoped; a role created by one organization is never visible or assignable in another." }
        name: { type: string }
        description: { type: string }
        is_superuser_role:
          type: boolean
          description: >
            Restricted - only assignable by an existing superuser within the same
            tenant (Reg. 12(b)(iv)). This is a tenant-scoped superuser (full admin
            rights within one organization only), NOT a platform-wide operator role -
            cross-tenant platform administration (e.g. Anthropic-style internal ops
            tooling) is intentionally out of scope for this contract and would live
            behind a separate, non-tenant-resolved internal API.
        requires_provider_identifier:
          type: boolean
          description: >
            True for clinical/healthcare-provider roles (doctor, nurse, clinical
            officer, lab tech) where Reg. 12(b)(v) requires the account be linked
            to a provider identifier issued by the System. False for administrative
            roles (receptionist, accountant, records clerk, IT admin) which need
            system access and RBAC like any staff account, but have no such
            regulatory linkage - inventing an identifier for them would misrepresent
            what the field means.
        permissions: { type: array, items: { type: string }, description: "e.g. patients:read, patients:write, billing:read, admin:users:write" }

    Session:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        device_label: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        current: { type: boolean }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, description: "Present even for pre-auth events (e.g. organization_registered, failed logins) since the tenant is resolved by subdomain before authentication." }
        timestamp: { type: string, format: date-time }
        user_id: { type: string }
        action: { type: string }
        target_resource: { type: string }
        ip_address: { type: string }
        result: { type: string, enum: [success, failure] }
        metadata:
          type: object
          additionalProperties: true
